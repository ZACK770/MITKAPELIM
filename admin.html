<!doctype html>
<html lang="he" dir="rtl">
<head>
  <!-- Google Tag Manager -->

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KDPN6ZZL');</script>
  <!-- End Google Tag Manager -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ניהול פניות | מתקפלים</title>
  <style>
    :root{--bg:#080808;--panel:#141414;--line:#303030;--gold:#e5c158;--text:#f8f6f1}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}
    .wrap{max-width:1050px;margin:auto;padding:40px 24px}
    h1{color:var(--gold);letter-spacing:.04em}
    h2{color:var(--gold);font-size:20px;margin:34px 0 12px}
    a{color:var(--gold)}
    button,input{font:inherit;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
    button,.button{background:var(--gold);color:#17130a;font-weight:700;cursor:pointer;margin:6px 6px 6px 0;display:inline-block;padding:10px 16px;border-radius:6px;text-decoration:none;border:0}
    .hidden{display:none}
    .error{color:#f18b7b;min-height:22px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{background:var(--panel);border:1px solid var(--line);padding:16px}
    .card strong{display:block;color:var(--gold);font-size:26px;margin-top:8px}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    .table-scroll{overflow-x:auto}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
    @media(max-width:700px){.cards{grid-template-columns:1fr}}
  </style>
  <script src="assets/app-api.js"></script>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KDPN6ZZL"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="wrap">
    <a href="index.html">חזרה לאתר</a>
    <h1>ניהול פניות ואנליטיקס</h1>
    <section id="login">
      <p>הזינו סיסמה כדי לצפות בנתונים השמורים בשרת.</p>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login-button">כניסה</button>
      <p class="error" id="error"></p>
    </section>
    <section id="dashboard" class="hidden">
      <div class="cards">
        <div class="card">סך פניות<strong id="stat-leads">0</strong></div>
        <div class="card">סך כניסות<strong id="stat-views">0</strong></div>
        <div class="card">דפים שנצפו<strong id="stat-pages">0</strong></div>
      </div>
      <p>
        <a class="button" id="download-leads">הורדת פניות לאקסל</a>
        <a class="button" id="download-analytics">הורדת אנליטיקס לאקסל</a>
        <button id="refresh">רענון נתונים</button>
        <button id="clear">מחיקת כל הנתונים</button>
      </p>
      <h2>פניות</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>תאריך</th><th>שם</th><th>טלפון</th><th>כמות</th><th>פרויקט</th><th>הערות</th><th>מקור</th></tr></thead>
        <tbody id="leads-rows"></tbody>
      </table></div>
      <h2>כניסות לפי דף</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>דף</th><th>כניסות</th></tr></thead>
        <tbody id="pages-rows"></tbody>
      </table></div>
    </section>
  </main>
  <script>
    const passwordInput=document.querySelector('#password');
    const errorText=document.querySelector('#error');
    const login=document.querySelector('#login');
    const dashboard=document.querySelector('#dashboard');

    function formatDate(value){
      const date=new Date(value);
      return Number.isNaN(date.getTime())?String(value||''):date.toLocaleString('he-IL');
    }

    function fillRow(values){
      const row=document.createElement('tr');
      values.forEach(value=>{const cell=document.createElement('td');cell.textContent=value??'';row.append(cell)});
      return row;
    }

    async function load(){
      const password=passwordInput.value;
      const data=await window.mitkapelimApi.summary(password);
      const pages=Object.entries(data.by_page).sort((first,second)=>second[1]-first[1]);
      document.querySelector('#stat-leads').textContent=data.leads.length;
      document.querySelector('#stat-views').textContent=data.views.length;
      document.querySelector('#stat-pages').textContent=pages.length;
      document.querySelector('#leads-rows').replaceChildren(...data.leads.map(lead=>fillRow([
        formatDate(lead.created_at),lead.name,lead.phone,lead.quantity,lead.project,lead.notes,lead.source
      ])));
      document.querySelector('#pages-rows').replaceChildren(...pages.map(([page,count])=>fillRow([page,count])));
      document.querySelector('#download-leads').href=window.mitkapelimApi.csv('/api/admin/leads.csv',password);
      document.querySelector('#download-analytics').href=window.mitkapelimApi.csv('/api/admin/analytics.csv',password);
    }

    document.querySelector('#login-button').addEventListener('click',async()=>{
      errorText.textContent='טוען נתונים מהשרת…';
      try{
        await load();
        login.classList.add('hidden');
        dashboard.classList.remove('hidden');
        errorText.textContent='';
      }catch(error){
        errorText.textContent='הסיסמה אינה נכונה או שאין חיבור לשרת.';
      }
    });

    passwordInput.addEventListener('keydown',event=>{if(event.key==='Enter')document.querySelector('#login-button').click()});
    document.querySelector('#refresh').addEventListener('click',()=>load().catch(()=>{errorText.textContent='רענון נכשל.'}));

    document.querySelector('#clear').addEventListener('click',async()=>{
      if(!confirm('למחוק את כל הפניות והכניסות מהשרת?'))return;
      try{
        await window.mitkapelimApi.clear(passwordInput.value);
        await load();
      }catch(error){
        errorText.textContent='המחיקה נכשלה.';
      }
    });
  </script>
</body>
</html>
