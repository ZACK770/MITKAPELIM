[project]
name = "mitkapelim-api"
version = "0.1.0"
description = "Persistent leads and analytics API for Mitkapelim"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0"
]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.uvicorn]
factory = false
